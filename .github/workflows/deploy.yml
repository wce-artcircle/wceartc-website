name: Deploy React Frontend to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Build the React app
        working-directory: ./Frontend
        run: npm run build

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Frontend/build
          publish_branch: gh-pages

      # Pages source is currently "main / (root)" and changing it needs admin
      # access, so publish the build output to the root of main directly.
      # Pushes made with GITHUB_TOKEN do not re-trigger workflows (no loop).
      - name: Publish build to Pages source (main root)
        run: |
          cp Frontend/build/index.html index.html
          rm -rf assets
          cp -r Frontend/build/assets assets
          touch .nojekyll
          git add -A index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "deploy: ${GITHUB_SHA}"
            git push origin main
          fi

name: Deploy React Frontend to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Build the React app
        working-directory: ./Frontend
        run: npm run build

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Frontend/build
          publish_branch: gh-pages

      # Pages source is currently "main / (root)" and changing it needs admin
      # access, so also publish the build output to the root of main.
      # Pushes made with GITHUB_TOKEN do not re-trigger workflows (no loop).
      - name: Deploy build to Pages source (main root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Frontend/build
          publish_branch: main
